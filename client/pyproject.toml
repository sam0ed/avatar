[project]
name = "avatar-client"
version = "0.1.0"
description = "Avatar client — local orchestrator, ASR, virtual camera/mic (Windows and macOS)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "huggingface-hub>=0.23,<1",
    "moonshine-voice>=0.0.49,<1",
    "msgpack>=1.0,<2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.17,<2",
    "opencv-python>=4.8,<5",
    "ormsgpack>=1.5,<2",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
    "pyobjc-framework-AVFoundation>=12.2.2,<13; sys_platform == 'darwin'",
    "pyvirtualcam>=0.15.0",
    "scipy>=1.17.1",
    "sounddevice>=0.5,<1",
    "transformers>=4.40,<5",
    "websockets>=13,<17",
]
