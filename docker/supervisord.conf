; Avatar Stage 2 — supervisord program definitions
; Manages 3 services in a single container:
;   1. LLM server  (llama-cpp-python, port 8001)
;   2. TTS server  (Fish Speech S1-mini, port 8080)
;   3. Orchestrator (FastAPI WebSocket, port 8000)
;
; Included by /etc/supervisor/supervisord.conf via [include] directive.
; Run with: supervisord -n -c /etc/supervisor/supervisord.conf

[program:mps]
command=nvidia-cuda-mps-control -f
environment=CUDA_MPS_PIPE_DIRECTORY="/tmp/nvidia-mps",CUDA_MPS_LOG_DIRECTORY="/tmp/nvidia-log"
priority=5
autostart=%(ENV_MPS_ENABLED)s
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/mps.log
stderr_logfile=/var/log/supervisor/mps_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:llm]
command=/opt/llm-venv/bin/python -m llama_cpp.server
    --model %(ENV_MODEL_DIR)s/%(ENV_MODEL_FILE)s
    --host 0.0.0.0
    --port %(ENV_LLM_PORT)s
    --n_gpu_layers %(ENV_N_GPU_LAYERS)s
    --n_ctx %(ENV_N_CTX)s
    --flash_attn %(ENV_FLASH_ATTN)s
directory=/app
environment=CUDA_VISIBLE_DEVICES="%(ENV_LLM_GPU)s",CUDA_MPS_PIPE_DIRECTORY="/tmp/nvidia-mps",CUDA_MPS_LOG_DIRECTORY="/tmp/nvidia-log"
priority=10
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/var/log/supervisor/llm.log
stderr_logfile=/var/log/supervisor/llm_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:tts]
command=bash /app/start_tts.sh
directory=/app
environment=FISH_STREAM_CHUNK_FRAMES="25",CUDA_VISIBLE_DEVICES="%(ENV_TTS_GPU)s",TTS_ENGINE="%(ENV_TTS_ENGINE)s",HIGGS_VRAM_GIB="%(ENV_HIGGS_VRAM_GIB)s",HIGGS_MODEL="%(ENV_HIGGS_MODEL)s",CUDA_MPS_PIPE_DIRECTORY="/tmp/nvidia-mps",CUDA_MPS_LOG_DIRECTORY="/tmp/nvidia-log",CUDA_MPS_ACTIVE_THREAD_PERCENTAGE="%(ENV_TTS_MPS_PCT)s"
priority=20
autostart=true
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/var/log/supervisor/tts.log
stderr_logfile=/var/log/supervisor/tts_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:musetalk]
command=/opt/musetalk-venv/bin/python -m uvicorn face_server:app --host 0.0.0.0 --port 8002
directory=/opt/musetalk
environment=AVATARS_DIR="/app/avatars",MUSETALK_DIR="/opt/musetalk",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1",CUDA_VISIBLE_DEVICES="%(ENV_FACE_GPU)s",CUDA_MPS_PIPE_DIRECTORY="/tmp/nvidia-mps",CUDA_MPS_LOG_DIRECTORY="/tmp/nvidia-log"
priority=25
autostart=%(ENV_FACE_ENABLED)s
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/var/log/supervisor/musetalk.log
stderr_logfile=/var/log/supervisor/musetalk_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:orchestrator]
command=uv run uvicorn src.api.server:app --host 0.0.0.0 --port 8000
directory=/app/orchestrator
environment=LLM_BASE_URL="http://localhost:8001",TTS_BASE_URL="http://localhost:8080",FACE_BASE_URL="http://localhost:8002",FACE_ENABLED="%(ENV_FACE_ENABLED)s",TTS_ENGINE="%(ENV_TTS_ENGINE)s"
priority=30
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/orchestrator.log
stderr_logfile=/var/log/supervisor/orchestrator_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
